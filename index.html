<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Tus rutas de estudio, con temporizador, historial y tutor." />
    <!-- Color de la barra del sistema; ThemeProvider lo cambia con el tema de la app. -->
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="LearnAI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>LearnAI</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro en modo oscuro.
      // La clave debe coincidir con THEME_STORAGE_KEY en src/lib/theme.ts.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('learnai-theme') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
