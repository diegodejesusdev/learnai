<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" role="img" aria-label="Comparación de capacidad fija frente a capacidad elástica" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <clipPath id="encima"><rect x="60" y="0" width="540" height="160"/></clipPath>
  </defs>
  <rect x="1" y="1" width="638" height="748" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">La nube ajusta la capacidad a la demanda</text>

  <!-- Panel A -->
  <g transform="translate(0,60)">
    <text x="32" y="30" font-size="18" font-weight="700" fill="#334155">Servidores propios: compras para el pico</text>
    <path d="M60,160 H600 V280 H60 Z" fill="#E2E8F0"/>
    <path d="M60,250 L140,232 L220,205 L300,218 L380,150 L440,118 L500,168 L600,212 V280 H60 Z" fill="#DBEAFE"/>
    <path d="M60,250 L140,232 L220,205 L300,218 L380,150 L440,118 L500,168 L600,212 V280 H60 Z" fill="#FECACA" clip-path="url(#encima)"/>
    <line x1="60" y1="160" x2="600" y2="160" stroke="#EA580C" stroke-width="4"/>
    <polyline points="60,250 140,232 220,205 300,218 380,150 440,118 500,168 600,212" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="60" y1="280" x2="600" y2="280" stroke="#64748B" stroke-width="2"/>
    <line x1="60" y1="90" x2="60" y2="280" stroke="#64748B" stroke-width="2"/>
    <text x="150" y="182" font-size="15" fill="#475569">Pagas sin usar</text>
    <text x="452" y="108" font-size="15" font-weight="700" fill="#B91C1C">Se cae</text>
    <text x="56" y="76" font-size="15" fill="#475569">Capacidad</text>
    <text x="600" y="302" font-size="15" fill="#475569" text-anchor="end">Tiempo</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(0,350)">
    <text x="32" y="30" font-size="18" font-weight="700" fill="#334155">Nube: la capacidad sigue a la demanda</text>
    <path d="M60,220 H140 V193 H300 V138 H380 V106 H500 V156 H600 V280 H60 Z" fill="#E2E8F0"/>
    <path d="M60,250 L140,232 L220,205 L300,218 L380,150 L440,118 L500,168 L600,212 V280 H60 Z" fill="#DBEAFE"/>
    <path d="M60,220 H140 V193 H300 V138 H380 V106 H500 V156 H600" fill="none" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="60,250 140,232 220,205 300,218 380,150 440,118 500,168 600,212" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="60" y1="280" x2="600" y2="280" stroke="#64748B" stroke-width="2"/>
    <line x1="60" y1="90" x2="60" y2="280" stroke="#64748B" stroke-width="2"/>
    <text x="56" y="76" font-size="15" fill="#475569">Capacidad</text>
    <text x="600" y="302" font-size="15" fill="#475569" text-anchor="end">Tiempo</text>
  </g>

  <!-- Leyenda -->
  <g transform="translate(32,690)" font-size="15" fill="#334155">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#0F172A" stroke-width="3.5"/><text x="36" y="5">Demanda real</text>
    <line x1="170" y1="0" x2="198" y2="0" stroke="#EA580C" stroke-width="4"/><text x="206" y="5">Capacidad pagada</text>
    <rect x="0" y="22" width="28" height="16" fill="#E2E8F0"/><text x="36" y="35">Capacidad sin usar</text>
    <rect x="200" y="22" width="28" height="16" fill="#FECACA"/><text x="236" y="35">Demanda sin capacidad</text>
  </g>
</svg>
