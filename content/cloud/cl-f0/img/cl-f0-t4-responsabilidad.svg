<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-label="Modelo de responsabilidad compartida: lo que proteges tú y lo que protege AWS" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="698" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Responsabilidad compartida</text>

  <rect x="32" y="66" width="576" height="276" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="52" y="98" font-size="19" font-weight="700" fill="#14532D">TÚ: seguridad EN la nube</text>
  <g font-size="16" fill="#14532D">
    <rect x="52" y="114" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#86EFAC"/><text x="68" y="138">Tus datos y su cifrado</text>
    <rect x="52" y="158" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#86EFAC"/><text x="68" y="182">Usuarios, roles y permisos (IAM)</text>
    <rect x="52" y="202" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#86EFAC"/><text x="68" y="226">Redes y firewalls (Security Groups)</text>
    <rect x="52" y="246" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#86EFAC"/><text x="68" y="270">Sistema operativo y parches (si usas EC2)</text>
    <rect x="52" y="290" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#86EFAC"/><text x="68" y="314">Configuración de cada servicio</text>
  </g>

  <rect x="32" y="358" width="576" height="232" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="52" y="390" font-size="19" font-weight="700" fill="#7C2D12">AWS: seguridad DE la nube</text>
  <g font-size="16" fill="#7C2D12">
    <rect x="52" y="406" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#FDBA74"/><text x="68" y="430">Centros de datos y seguridad física</text>
    <rect x="52" y="450" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#FDBA74"/><text x="68" y="474">Servidores, discos y red física</text>
    <rect x="52" y="494" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#FDBA74"/><text x="68" y="518">Virtualización que aísla a los clientes</text>
    <rect x="52" y="538" width="536" height="36" rx="8" fill="#FFFFFF" stroke="#FDBA74"/><text x="68" y="562">Software de los servicios administrados</text>
  </g>

  <text x="32" y="624" font-size="16" font-weight="700" fill="#334155">Tu parte de trabajo según el servicio</text>
  <line x1="60" y1="650" x2="580" y2="650" stroke="#475569" stroke-width="2.5" marker-end="url(#flecha)" marker-start="url(#flecha)"/>
  <g font-size="15" fill="#334155">
    <text x="60" y="680">EC2: más</text>
    <text x="320" y="680" text-anchor="middle">RDS</text>
    <text x="580" y="680" text-anchor="end">S3 o Lambda: menos</text>
  </g>
</svg>
