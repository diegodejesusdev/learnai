<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Cómo se leen los permisos -rwxr-x--- y su valor 750" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
