  <g font-size="16" fill="#334155"><text x="52" y="316">r = leer (4)</text><text x="190" y="316">w = escribir (2)</text><text x="358" y="316">x = ejecutar o entrar (1)</text></g>
  <text x="52" y="350" font-size="18" fill="#0F172A" font-family="DejaVu Sans Mono, monospace" font-weight="700">chmod 750 archivo</text>
