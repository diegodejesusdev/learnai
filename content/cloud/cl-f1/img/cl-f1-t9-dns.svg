<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-label="Resolución DNS: el navegador pregunta al resolvedor, que consulta la raíz, el servidor de .co y el autoritativo antes de responder con la IP" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="638" height="598" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Cómo se resuelve www.learnai.co</text>
  <g font-size="15" text-anchor="middle">
    <rect x="32" y="166" width="150" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="107" y="198" font-weight="700" fill="#14532D">Navegador</text><text x="107" y="220" font-size="13" fill="#14532D">tu computador</text>
    <rect x="232" y="166" width="150" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="307" y="198" font-weight="700" fill="#78350F">Resolvedor</text><text x="307" y="220" font-size="13" fill="#78350F">de tu proveedor</text>
    <rect x="440" y="70" width="168" height="62" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="524" y="98" font-weight="700" fill="#4C1D95">Servidor raíz</text><text x="524" y="119" font-size="13" fill="#4C1D95">remite a .co</text>
    <rect x="440" y="170" width="168" height="62" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="524" y="198" font-weight="700" fill="#4C1D95">Servidor de .co</text><text x="524" y="219" font-size="13" fill="#4C1D95">remite a learnai.co</text>
    <rect x="440" y="270" width="168" height="62" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="524" y="298" font-weight="700" fill="#1E3A8A">Autoritativo</text><text x="524" y="319" font-size="13" fill="#1E3A8A">tiene el registro A</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="182" y1="190" x2="226" y2="190" marker-end="url(#fl)"/>
    <line x1="232" y1="214" x2="188" y2="214" marker-end="url(#fl)" stroke="#16A34A"/>
    <path d="M382,180 L434,108" marker-end="url(#fl)"/>
    <line x1="382" y1="201" x2="434" y2="201" marker-end="url(#fl)"/>
    <path d="M382,222 L434,294" marker-end="url(#fl)"/>
  </g>
  <g font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="204" cy="172" r="13" fill="#0F172A"/><text x="204" y="178">1</text>
    <circle cx="396" cy="132" r="13" fill="#0F172A"/><text x="396" y="138">2</text>
    <circle cx="408" cy="184" r="13" fill="#0F172A"/><text x="408" y="190">3</text>
    <circle cx="396" cy="270" r="13" fill="#0F172A"/><text x="396" y="276">4</text>
    <circle cx="210" cy="238" r="13" fill="#16A34A"/><text x="210" y="244">5</text>
  </g>
  <g font-size="15" fill="#334155">
    <text x="32" y="384"><tspan font-weight="700">1.</tspan> El navegador pregunta: ¿cuál es la IP de www.learnai.co?</text>
    <text x="32" y="416"><tspan font-weight="700">2.</tspan> La raíz responde: pregúntale al servidor de .co</text>
    <text x="32" y="448"><tspan font-weight="700">3.</tspan> El de .co responde: pregúntale al de learnai.co</text>
    <text x="32" y="480"><tspan font-weight="700">4.</tspan> El autoritativo responde: 203.0.113.10</text>
    <text x="32" y="512"><tspan font-weight="700">5.</tspan> El resolvedor entrega la IP y la guarda en caché</text>
    <text x="52" y="536">durante el TTL (por ejemplo, 300 segundos)</text>
    <text x="32" y="572" fill="#475569">Mientras dure el TTL, las siguientes consultas se saltan los pasos 2 a 4.</text>
  </g>
</svg>
