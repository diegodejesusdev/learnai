<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Autenticación SSH con llaves: el servidor envía un reto, tu computador lo firma con la llave privada y el servidor lo verifica con la pública" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="638" height="558" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Cómo entra SSH con llaves</text>
  <rect x="32" y="66" width="230" height="110" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="147" y="96" font-size="17" font-weight="700" fill="#14532D" text-anchor="middle">Tu computador</text>
  <text x="147" y="124" font-size="15" fill="#14532D" text-anchor="middle">Llave privada</text>
  <text x="147" y="146" font-size="14" fill="#14532D" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">~/.ssh/id_ed25519</text>
  <text x="147" y="166" font-size="13" fill="#B91C1C" text-anchor="middle" font-weight="700">nunca sale de aquí</text>
  <rect x="378" y="66" width="230" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="493" y="96" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="middle">Servidor</text>
  <text x="493" y="124" font-size="15" fill="#1E3A8A" text-anchor="middle">Llave pública en</text>
  <text x="493" y="146" font-size="14" fill="#1E3A8A" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">authorized_keys</text>
  <line x1="147" y1="176" x2="147" y2="500" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="493" y1="176" x2="493" y2="500" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-size="15" fill="#0F172A">
    <line x1="150" y1="230" x2="488" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="320" y="220" text-anchor="middle">1. Quiero entrar como ubuntu</text>
    <line x1="490" y1="300" x2="152" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="320" y="290" text-anchor="middle">2. Reto: firma este dato aleatorio</text>
    <line x1="150" y1="370" x2="488" y2="370" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="320" y="360" text-anchor="middle">3. Firma hecha con la llave privada</text>
    <rect x="388" y="400" width="210" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="493" y="426" text-anchor="middle" fill="#14532D">4. Verifica con la</text>
    <text x="493" y="448" text-anchor="middle" fill="#14532D" font-weight="700">pública: acceso ✓</text>
  </g>
  <text x="32" y="534" font-size="15" fill="#334155">Por la red solo viaja la firma, nunca la llave privada.</text>
</svg>
