<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-label="Los cinco pasos al abrir una página: DNS, conexión TCP, TLS, petición HTTP y respuesta" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="638" height="598" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Qué pasa al abrir una página</text>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="40" y="66" width="140" height="44" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="110" y="94" fill="#14532D">Navegador</text>
    <rect x="250" y="66" width="140" height="44" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="320" y="94" fill="#4C1D95">DNS</text>
    <rect x="460" y="66" width="140" height="44" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="530" y="94" fill="#1E3A8A">Servidor</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5">
    <line x1="110" y1="110" x2="110" y2="570"/><line x1="320" y1="110" x2="320" y2="570"/><line x1="530" y1="110" x2="530" y2="570"/>
  </g>
  <g font-size="15" fill="#0F172A">
    <rect x="32" y="128" width="576" height="88" rx="10" fill="#F5F3FF" fill-opacity="0.5"/>
    <text x="44" y="150" font-weight="700" fill="#4C1D95">1. DNS</text>
    <line x1="114" y1="172" x2="314" y2="172" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="214" y="164" text-anchor="middle" font-size="14">¿IP de learnai.co?</text>
    <line x1="316" y1="202" x2="116" y2="202" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="214" y="196" text-anchor="middle" font-size="14">203.0.113.10</text>

    <text x="44" y="246" font-weight="700" fill="#1E3A8A">2. Conexión TCP</text>
    <line x1="114" y1="268" x2="524" y2="268" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)" marker-start="url(#fl)"/>
    <text x="320" y="290" text-anchor="middle" font-size="14">saludo de 3 pasos: SYN, SYN-ACK, ACK (puerto 443)</text>

    <text x="44" y="330" font-weight="700" fill="#1E3A8A">3. TLS</text>
    <line x1="114" y1="352" x2="524" y2="352" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)" marker-start="url(#fl)"/>
    <text x="320" y="374" text-anchor="middle" font-size="14">certificado y llaves: desde aquí todo va cifrado</text>

    <text x="44" y="414" font-weight="700" fill="#1E3A8A">4. Petición HTTP</text>
    <line x1="114" y1="436" x2="524" y2="436" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="320" y="428" text-anchor="middle" font-size="14" font-family="DejaVu Sans Mono, monospace">GET / HTTP/1.1</text>

    <text x="44" y="486" font-weight="700" fill="#14532D">5. Respuesta</text>
    <line x1="526" y1="508" x2="116" y2="508" stroke="#16A34A" stroke-width="2.5" marker-end="url(#fl)"/>
    <text x="320" y="500" text-anchor="middle" font-size="14" font-family="DejaVu Sans Mono, monospace">200 OK + HTML</text>
    <text x="320" y="548" text-anchor="middle" font-size="14" fill="#475569">El navegador repite 4 y 5 para imágenes, CSS y scripts</text>
  </g>
</svg>
