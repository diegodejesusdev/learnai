<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Arquitectura típica: el usuario llega al balanceador con TLS en la red pública, que reparte el tráfico a dos servidores en la red privada; los servidores salen a internet por un NAT y no aceptan conexiones directas" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="638" height="638" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Arquitectura web típica en la nube</text>
  <rect x="220" y="62" width="200" height="50" rx="25" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="320" y="93" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Usuarios en internet</text>
  <line x1="320" y1="112" x2="320" y2="166" stroke="#475569" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="332" y="146" font-size="14" fill="#B45309" font-weight="700">firewall: solo 80 y 443</text>
  <rect x="32" y="172" width="576" height="130" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="48" y="196" font-size="15" font-weight="700" fill="#14532D">Red pública</text>
  <rect x="200" y="210" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="320" y="240" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Balanceador de carga</text>
  <text x="320" y="264" font-size="14" fill="#14532D" text-anchor="middle">con certificado TLS (HTTPS)</text>
  <rect x="470" y="222" width="122" height="52" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="531" y="254" font-size="16" font-weight="700" fill="#78350F" text-anchor="middle">NAT</text>
  <rect x="32" y="330" width="576" height="186" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="48" y="354" font-size="15" font-weight="700" fill="#1E3A8A">Red privada</text>
  <rect x="80" y="400" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="180" y="433" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">Servidor de app 1</text>
  <text x="180" y="456" font-size="13" fill="#1E3A8A" text-anchor="middle">Nginx + API</text>
  <rect x="300" y="400" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="433" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">Servidor de app 2</text>
  <text x="400" y="456" font-size="13" fill="#1E3A8A" text-anchor="middle">Nginx + API</text>
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M270,282 L190,396" marker-end="url(#fl)"/>
    <path d="M370,282 L400,396" marker-end="url(#fl)"/>
    <path d="M500,430 H550 V280" marker-end="url(#fl)" stroke="#D97706" stroke-dasharray="7 5"/>
  </g>
  <text x="540" y="350" font-size="13" fill="#78350F" text-anchor="end">salida a</text>
  <text x="540" y="368" font-size="13" fill="#78350F" text-anchor="end">internet</text>
  <text x="48" y="500" font-size="13" fill="#1E3A8A">sin IP pública: nadie entra directo desde internet</text>
  <g font-size="15" fill="#334155">
    <text x="32" y="552">El balanceador reparte el tráfico y deja de enviar a un</text>
    <text x="32" y="574">servidor si su revisión de salud falla. El NAT permite</text>
    <text x="32" y="596">descargar actualizaciones sin exponer los servidores.</text>
  </g>
</svg>
